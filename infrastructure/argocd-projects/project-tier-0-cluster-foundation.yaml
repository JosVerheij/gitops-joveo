apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: t0-infrastructure  # tier-0
  namespace: argocd
spec:
  description: "Tier 0: Cluster foundation, networking, storage and infrastructure primitives"

  sourceRepos:
    - 'https://github.com/JosVerheij/gitops-joveo.git'
    - 'oci://quay.io/cilium/charts/cilium'
    - 'oci://ghcr.io/kyverno/charts/kyverno'
    # - 'oci://ghcr.io/piraeusdatastore/piraeus-operator/piraeus'

  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: '*'

  clusterResourceWhitelist:
    # Kubernetes API extensions
    - group: 'apiextensions.k8s.io'
      kind: 'CustomResourceDefinition'

    # Cluster GatewayClass
    - group: gateway.networking.k8s.io
      kind: GatewayClass

      # Kubernetes admission policies
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding

      # Kubernetes admission webhooks
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

    # Cluster namespaces
    - group: ''
      kind: 'Namespace'

    # Cluster RBAC
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRole'
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRoleBinding'

    # Cilium cluster infrastructure
    # - group: 'cilium.io'
    #   kind: '*'
    - group: cilium.io
      kind: CiliumClusterwideNetworkPolicy

    # Storage infrastructure
    - group: 'storage.k8s.io'
      kind: 'StorageClass'
    - group: 'storage.k8s.io'
      kind: 'CSIDriver'
    - group: 'snapshot.storage.k8s.io'
      kind: '*'

    # Piraeus / LINSTOR cluster resources
    # - group: 'piraeus.io'
    #   kind: '*'
    # - group: 'linstor.linbit.com'
    #   kind: '*'

    # Kyverno cluster-wide policies
    - group: policies.kyverno.io
      kind: ValidatingPolicy

    - group: policies.kyverno.io
      kind: ImageValidatingPolicy

    # Add only when actually used:
    # - group: policies.kyverno.io
    #   kind: MutatingPolicy
    # - group: policies.kyverno.io
    #   kind: GeneratingPolicy
    # - group: policies.kyverno.io
    #   kind: DeletingPolicy

  namespaceResourceWhitelist:
    # Argo CD CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.argoproj.io'

    # Cilium CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.cilium.io'

    # Kyverno CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.kyverno.io'

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.policies.kyverno.io'

    # Retain these only if the corresponding Piraeus/LINSTOR
    # CRDs are still managed by T0.
    # - group: apiextensions.k8s.io
    #   kind: CustomResourceDefinition
    #   name: '*.piraeus.io'

    # - group: apiextensions.k8s.io
    #   kind: CustomResourceDefinition
    #   name: '*.linstor.linbit.com'

    # Namespaces managed by T0.
    # Include all existing T0-owned namespaces.
    - group: ''
      kind: Namespace
      name: argocd

    - group: ''
      kind: Namespace
      name: kube-system

    - group: ''
      kind: Namespace
      name: kyverno

    - group: ''
      kind: Namespace
      name: cert-manager

    - group: ''
      kind: Namespace
      name: rook-ceph

    - group: ''
      kind: Namespace
      name: gateways
