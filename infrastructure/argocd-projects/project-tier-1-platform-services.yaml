apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: t1-platform  # tier-1
  namespace: argocd
spec:
  description: "Tier 1: Platform operators, security services and cluster controllers"

  sourceRepos:
    - 'https://github.com/JosVerheij/gitops-joveo.git'
    - 'oci://quay.io/jetstack/charts/cert-manager'
    - 'oci://ghcr.io/rook/rook-ceph'
    - 'oci://ghcr.io/rook/rook-ceph-cluster'

  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: 'cert-manager'
    - server: 'https://kubernetes.default.svc'
      namespace: 'gateways'
    - server: 'https://kubernetes.default.svc'
      namespace: 'rook-ceph'

  clusterResourceWhitelist:
    # cert-manager CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.cert-manager.io'

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.acme.cert-manager.io'

    # Rook CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.ceph.rook.io'

    # Only when using Rook ObjectBucket resources
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.objectbucket.io'

    # Gateway API CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.gateway.networking.k8s.io'

    # cert-manager
    - group: cert-manager.io
      kind: ClusterIssuer

    # Gateway API
    - group: gateway.networking.k8s.io
      kind: GatewayClass

    # Rook / storage, if these are declared in Git
    - group: storage.k8s.io
      kind: StorageClass

    - group: storage.k8s.io
      kind: CSIDriver

    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass

  namespaceResourceWhitelist:
    # Core resources
    - group: ''
      kind: ConfigMap

    - group: ''
      kind: Secret

    - group: ''
      kind: Service

    - group: ''
      kind: ServiceAccount

    # Workloads
    - group: apps
      kind: Deployment

    - group: apps
      kind: StatefulSet

    - group: apps
      kind: DaemonSet

    # Helm hooks / installation jobs
    - group: batch
      kind: Job

    # Controller coordination
    - group: coordination.k8s.io
      kind: Lease

    # Availability
    - group: policy
      kind: PodDisruptionBudget

    # cert-manager
    - group: cert-manager.io
      kind: Certificate

    - group: cert-manager.io
      kind: CertificateRequest

    - group: cert-manager.io
      kind: Issuer

    - group: acme.cert-manager.io
      kind: Order

    - group: acme.cert-manager.io
      kind: Challenge

    # Rook-Ceph
    - group: ceph.rook.io
      kind: CephCluster

    - group: ceph.rook.io
      kind: CephBlockPool

    - group: ceph.rook.io
      kind: CephFilesystem

    - group: ceph.rook.io
      kind: CephObjectStore

    - group: ceph.rook.io
      kind: CephObjectStoreUser

    - group: ceph.rook.io
      kind: CephNFS

    # Gateway API
    - group: gateway.networking.k8s.io
      kind: Gateway
