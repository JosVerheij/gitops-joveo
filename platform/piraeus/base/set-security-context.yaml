apiVersion: apps/v1
kind: Deployment
# metadata:
#   name: my-nginx
spec:
  template:
    spec:
      containers:
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]

