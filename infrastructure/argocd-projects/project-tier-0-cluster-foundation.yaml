apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: t0-infrastructure  # tier-0
  namespace: argocd
spec:
  description: "Tier 0: Cluster foundation, networking, storage and infrastructure primitives"

  sourceRepos:
    - 'https://github.com/JosVerheij/gitops-joveo.git'
    - 'oci://quay.io/cilium/charts/cilium'
    - 'oci://ghcr.io/kyverno/charts/kyverno'
    # - 'oci://ghcr.io/piraeusdatastore/piraeus-operator/piraeus'

  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kyverno

  clusterResourceWhitelist:
    # Kubernetes API extensions
    - group: 'apiextensions.k8s.io'
      kind: 'CustomResourceDefinition'

    # Cluster GatewayClass
    - group: gateway.networking.k8s.io
      kind: GatewayClass

      # Kubernetes admission policies
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding

      # Kubernetes admission webhooks
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

    # Cluster namespaces
    - group: ''
      kind: 'Namespace'

    # Cluster RBAC
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRole'
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRoleBinding'

    # Cilium cluster infrastructure
    - group: 'cilium.io'
      kind: '*'
    # - group: cilium.io
    #   kind: CiliumClusterwideNetworkPolicy

    # Storage infrastructure
    - group: 'storage.k8s.io'
      kind: 'StorageClass'
    - group: 'storage.k8s.io'
      kind: 'CSIDriver'
    - group: 'snapshot.storage.k8s.io'
      kind: '*'

    # Kyverno cluster-wide policies
    - group: policies.kyverno.io
      kind: ValidatingPolicy

    - group: policies.kyverno.io
      kind: ImageValidatingPolicy

    # Add only when actually used:
    # - group: policies.kyverno.io
    #   kind: MutatingPolicy
    # - group: policies.kyverno.io
    #   kind: GeneratingPolicy
    # - group: policies.kyverno.io
    #   kind: DeletingPolicy

    # cert-manager Cluster Issuer
    - group: cert-manager.io
      kind: ClusterIssuer

    # Argo CD CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.argoproj.io'

    # Cilium CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.cilium.io'

    # Kyverno CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.kyverno.io'

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.policies.kyverno.io'

    # Kyverno
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.kyverno.io'

    # Gateway API
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.gateway.networking.k8s.io'

    # Only when using Rook ObjectBucket resources
    # - group: apiextensions.k8s.io
    #   kind: CustomResourceDefinition
    #   name: '*.objectbucket.io'

  namespaceResourceWhitelist:
    - group: ''
      kind: '*'
