apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: t1-platform  # tier-1
  namespace: argocd
spec:
  description: "Tier 1: Platform operators, security services and cluster controllers"

  sourceRepos:
    - 'https://github.com/JosVerheij/gitops-joveo.git'
    - 'oci://quay.io/jetstack/charts/cert-manager'
    - 'oci://ghcr.io/rook/rook-ceph'
    - 'oci://ghcr.io/rook/rook-ceph-cluster'

  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: 'cert-manager'
    - server: 'https://kubernetes.default.svc'
      namespace: 'gateways'
    - server: 'https://kubernetes.default.svc'
      namespace: 'rook-ceph'

  clusterResourceWhitelist:
    # Rook / storage, if these are declared in Git
    - group: storage.k8s.io
      kind: StorageClass

    - group: storage.k8s.io
      kind: CSIDriver

    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass

    # cert-manager CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.cert-manager.io'

    # Rook CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.ceph.rook.io'

    # cert-manager CA Injector
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: '*.cert-manager.io'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: '*.cert-manager.io'

  namespaceResourceWhitelist:
    # Kubernetes core resources
    - group: ''
      kind: ConfigMap

    - group: ''
      kind: Secret

    - group: ''
      kind: Service

    - group: ''
      kind: ServiceAccount

    - group: ''
      kind: Endpoints

    - group: ''
      kind: Pod

    - group: ''
      kind: PersistentVolumeClaim

    # Kubernetes workloads
    - group: apps
      kind: Deployment

    - group: apps
      kind: StatefulSet

    - group: apps
      kind: DaemonSet

    - group: apps
      kind: ReplicaSet

    # Kubernetes batch workloads
    - group: batch
      kind: Job

    - group: batch
      kind: CronJob

    # Kubernetes RBAC (namespaced)
    - group: rbac.authorization.k8s.io
      kind: Role

    - group: rbac.authorization.k8s.io
      kind: RoleBinding

    # Kubernetes coordination and availability
    - group: coordination.k8s.io
      kind: Lease

    - group: policy
      kind: PodDisruptionBudget

    # Kubernetes service discovery
    - group: discovery.k8s.io
      kind: EndpointSlice

    # cert-manager
    - group: cert-manager.io
      kind: Certificate

    - group: cert-manager.io
      kind: CertificateRequest

    - group: cert-manager.io
      kind: Issuer

    - group: acme.cert-manager.io
      kind: Order

    - group: acme.cert-manager.io
      kind: Challenge

    # Rook-Ceph
    - group: ceph.rook.io
      kind: CephCluster

    - group: ceph.rook.io
      kind: CephBlockPool

    - group: ceph.rook.io
      kind: CephFilesystem

    - group: ceph.rook.io
      kind: CephFilesystemMirror

    - group: ceph.rook.io
      kind: CephFilesystemSubVolumeGroup

    - group: ceph.rook.io
      kind: CephObjectStore

    - group: ceph.rook.io
      kind: CephObjectStoreUser

    - group: ceph.rook.io
      kind: CephObjectRealm

    - group: ceph.rook.io
      kind: CephObjectZone

    - group: ceph.rook.io
      kind: CephObjectZoneGroup

    - group: ceph.rook.io
      kind: CephNFS

    - group: ceph.rook.io
      kind: CephClient

    - group: ceph.rook.io
      kind: CephRBDMirror

    - group: ceph.rook.io
      kind: CephBucketNotification

    - group: ceph.rook.io
      kind: CephBucketTopic

    - group: ceph.rook.io
      kind: CephCOSIDriver

    # Legacy Rook object bucket provisioning, if used
    # - group: objectbucket.io
    #   kind: ObjectBucketClaim

    # Gateway API
    - group: gateway.networking.k8s.io
      kind: Gateway
