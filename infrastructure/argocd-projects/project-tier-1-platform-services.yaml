apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: t1-platform  # tier-1
  namespace: argocd
spec:
  description: "Tier 1: Platform operators, security services and cluster controllers"

  sourceRepos:
    - 'https://github.com/JosVerheij/gitops-joveo.git'
    - 'oci://quay.io/jetstack/charts/cert-manager'
    - 'oci://ghcr.io/rook/rook-ceph'
    - 'oci://ghcr.io/rook/rook-ceph-cluster'

  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: 'cert-manager'
    - server: 'https://kubernetes.default.svc'
      namespace: 'gateways'
    - server: 'https://kubernetes.default.svc'
      namespace: 'rook-ceph'

  clusterResourceWhitelist:
    # Rook / storage, if these are declared in Git
    - group: storage.k8s.io
      kind: StorageClass

    - group: storage.k8s.io
      kind: CSIDriver

    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass

    # cert-manager CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.cert-manager.io'

    # Rook CRDs
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: '*.ceph.rook.io'

  namespaceResourceBlacklist:
    - group: ''
      kind: 'Namespace'

    # Networking is exclusively managed by T0
    - group: networking.k8s.io
      kind: NetworkPolicy

    - group: cilium.io
      kind: CiliumNetworkPolicy
