cephClusterSpec:
  resources:
    mds:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    mon:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

    mgr:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    osd:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        memory: 3Gi

    mgr-sidecar:
      requests:
        cpu: 50m
        memory: 40Mi

    crashcollector:
      requests:
        cpu: 25m
        memory: 60Mi

    logcollector:
      requests:
        cpu: 25m
        memory: 100Mi

    exporter:
      requests:
        cpu: 25m
        memory: 50Mi

cephFileSystems:
  - name: ceph-filesystem
    # see https://github.com/rook/rook/blob/master/Documentation/CRDs/Shared-Filesystem/ceph-filesystem-crd.md#filesystem-settings for available configuration
    spec:
      metadataServer:
        activeCount: 1
        activeStandby: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
